<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link rel="shortcut icon" href="imagens/login.png" type="image/x-icon">
</head>
<body>
    <main>
        <section id="login">
            <div id="img">
            
            </div>
            <form action="cadastro.php" autocomplete="on">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>

                <div id="email">
                    <span class="material-icons">person</span>
                    <input type="email" name="email" id="iemail" placeholder="seu e-mail" required autocomplete="email">
                    <label for="iemail">Login</label>
                </div>

                <div id="senha">
                    <span class="material-icons">vpn_key</span>
                    <input type="password" name="senha" id="isenha" placeholder="sua senha" autocomplete="current-password">
                    <label for="isenha">Senha</label>
                </div>

                <div>
                    <input type="submit" value="Entrar" id="enviar">
                </div>

                <div>
                    <a href="esqueci.html">Esqueci a senha <span class="material-icons">mail</span></a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
